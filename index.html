<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ApexFocus</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0B0F17;
      --border: #1E293B;
      --accent: #00F0FF;
      --danger: #FF5E7E;
      --text: #FFFFFF;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
    .app-shell { width: 100%; max-width: 440px; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); padding-bottom: 75px; }
    
    header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 20; }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--accent); }
    .streak-badge { background: #1C1204; border: 1px solid #78350F; color: #F59E0B; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }

    .target-bar-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .target-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .progress-track { width: 100%; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 45%; background: var(--accent); border-radius: 999px; }

    .tabs-nav { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin: 16px; p: 2px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--muted); font-size: 0.8rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #000; font-weight: 700; }

    .content-panel { padding: 0 16px; flex: 1; display: none; }
    .content-panel.active { display: block; }

    .timer-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 16px; text-align: center; margin-bottom: 16px; }
    .timer-display { font-size: 3.5rem; font-weight: 800; letter-spacing: -1px; margin: 12px 0; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 10px; justify-content: center; }
    .btn { padding: 12px 24px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--border); color: #FFF; }
    .btn-danger { background: var(--danger); color: #FFF; }

    .input-field { width: 100%; background: #05080E; border: 1px solid var(--border); color: #FFF; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }
    .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 440px; background: rgba(0,0,0,0.92); border-top: 1px solid var(--border); backdrop-filter: blur(8px); display: flex; justify-content: space-around; padding: 10px 0; z-index: 20; }
    .nav-item { border: none; background: transparent; color: var(--muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: var(--accent); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand">APEX<span>FOCUS</span></div>
      <div class="streak-badge">🔥 <span id="streakCount">14</span> DAYS</div>
    </header>

    <div class="target-bar-wrap">
      <div class="target-labels">
        <span>Daily Target</span>
        <span id="targetHours">4.5h / 10h</span>
      </div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchMode('study')">⚡ Self-Study</button>
      <button class="tab-btn" onclick="switchMode('lecture')">🎥 Lecture Mode</button>
    </div>

    <!-- Self Study View -->
    <div id="studyView" class="content-panel active">
      <div class="timer-card">
        <div style="font-size: 0.8rem; color: var(--muted);">DEEP WORK POMODORO</div>
        <div class="timer-display" id="studyTimer">50:00</div>
        <div class="controls">
          <button class="btn btn-primary" id="studyStartBtn" onclick="toggleTimer()">START</button>
          <button class="btn btn-secondary" onclick="resetTimer()">RESET</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Brain Dump (Zero Distraction)</div>
        <input type="text" class="input-field" id="brainDumpInput" placeholder="Quick thought / distraction note...">
        <button class="btn btn-secondary" style="width: 100%; padding: 8px;" onclick="addNote()">Log Thought</button>
        <ul id="noteList" style="list-style: none; margin-top: 10px; font-size: 0.8rem; color: var(--muted);"></ul>
      </div>
    </div>

    <!-- Lecture View -->
    <div id="lectureView" class="content-panel">
      <div class="card">
        <div class="card-title">YouTube Study Stream</div>
        <input type="text" class="input-field" id="ytUrl" placeholder="Paste YouTube Video Link...">
        <button class="btn btn-secondary" style="width: 100%; padding: 8px; margin-bottom: 12px;" onclick="loadVideo()">Load Stream</button>
        <div class="video-container" id="videoHolder">
          <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem;">Embed Stream Placeholder</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Physical Notes Verification</div>
        <p style="font-size: 0.75rem; color: var(--muted); margin-bottom: 10px;">Mandatory snapshot required to record completed lecture hours.</p>
        <input type="file" accept="image/*" capture="environment" class="input-field" style="padding: 6px;">
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active"><span>⏱️</span>Focus</button>
      <button class="nav-item"><span>🎯</span>Targets</button>
      <button class="nav-item"><span>⚔️</span>Arena</button>
      <button class="nav-item"><span>👤</span>Profile</button>
    </nav>
  </div>

  <script>
    let timerInterval = null;
    let secondsLeft = 50 * 60;
    let isRunning = false;

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('studyStartBtn');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        btn.innerText = 'RESUME';
      } else {
        isRunning = true;
        btn.innerText = 'PAUSE';
        timerInterval = setInterval(() => {
          if (secondsLeft > 0) {
            secondsLeft--;
            document.getElementById('studyTimer').innerText = formatTime(secondsLeft);
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            alert('Session Completed! Great focus.');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      secondsLeft = 50 * 60;
      document.getElementById('studyTimer').innerText = '50:00';
      document.getElementById('studyStartBtn').innerText = 'START';
    }

    function switchMode(mode) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons[0].classList.toggle('active', mode === 'study');
      buttons[1].classList.toggle('active', mode === 'lecture');
      document.getElementById('studyView').classList.toggle('active', mode === 'study');
      document.getElementById('lectureView').classList.toggle('active', mode === 'lecture');
    }

    function loadVideo() {
      const url = document.getElementById('ytUrl').value;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        document.getElementById('videoHolder').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${match[2]}" frameborder="0" allowfullscreen></iframe>`;
      } else {
        alert('Invalid YouTube URL');
      }
    }

    function addNote() {
      const input = document.getElementById('brainDumpInput');
      if (!input.value.trim()) return;
      const list = document.getElementById('noteList');
      const li = document.createElement('li');
      li.style.padding = '4px 0';
      li.style.borderBottom = '1px solid #1E293B';
      li.innerText = `• ${input.value}`;
      list.appendChild(li);
      input.value = '';
    }
  </script>
</body>
</html>
